<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dokan &amp; WP Hisab</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6b7380;--bd:#e1e4e8;--pl:#0a7d3b;--mi:#c0392b;--ac:#2456d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1d2026;--tx:#eceff3;--mut:#9aa3af;--bd:#2d323a;--pl:#3ecf7b;--mi:#ff6b5b;--ac:#6c93ff}}
:root[data-theme="dark"]{--bg:#14161a;--card:#1d2026;--tx:#eceff3;--mut:#9aa3af;--bd:#2d323a;--pl:#3ecf7b;--mi:#ff6b5b;--ac:#6c93ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:640px;margin-inline:auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.tabs{display:flex;gap:8px}
.r2 .tabs{flex:none;gap:4px}.r2 .tabs button{flex:none;padding:9px 10px;font-size:14px}#top .tabs button{padding:11px 14px;font-size:15px}.clk{flex:1;min-width:0;font-size:13px;line-height:1.3;color:var(--mut)}.clk b{display:block;font-size:19px;color:var(--tx)}
.tabs button{flex:1;padding:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:17px;font-weight:600}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.bal{font-size:30px;font-weight:700}
.bx{display:flex;gap:10px}
.bc{flex:1;min-width:0;padding:14px 12px;border-radius:14px;background:linear-gradient(135deg,#2456d6,#7a4df0);color:#fff;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;box-shadow:0 4px 14px rgba(36,86,214,.25);transition:transform .15s}
.bc:active{transform:scale(.97)}
#c-bal{background:linear-gradient(135deg,#0f9d78,#2bb5c8);box-shadow:0 4px 14px rgba(15,157,120,.25)}
.bl{font-size:13px;opacity:.9;margin-bottom:6px}
.bv{font-size:24px;font-weight:700;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bv.pop{animation:pop .7s ease}
@keyframes pop{0%{filter:blur(8px);transform:scale(.7);opacity:.2}60%{transform:scale(1.08)}100%{filter:blur(0);transform:scale(1);opacity:1}}
.mut{color:var(--mut);font-size:13px}
input,select{width:100%;padding:11px;margin-top:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:16px}
.io{display:flex;gap:8px;margin-top:8px}
.io button{padding:8px 11px;border-radius:8px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font-size:14px;font-weight:700;white-space:nowrap}
.io button.on.in{background:var(--mi);border-color:var(--mi);color:#fff}
.io button.on.out{background:var(--pl);border-color:var(--pl);color:#fff}
.io.off{opacity:.35;pointer-events:none}
.save{padding:9px 22px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-size:15px;font-weight:700}.sv{display:flex;justify-content:flex-end;margin-top:10px}.r2{display:flex;gap:6px;margin-top:8px;align-items:center}.r2 input,.r2 select{flex:1;min-width:0;margin-top:0}.r2 .io{margin-top:0}.r2 .add{padding:8px 16px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-size:22px;font-weight:700;line-height:1.2}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{white-space:nowrap;padding:6px 12px;border:1px solid var(--bd);border-radius:20px;background:var(--card);color:var(--tx);font-size:14px}
.chip.on{background:var(--tx);color:var(--bg)}
.row{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.nm{font-size:19px;font-weight:600}
.num,.dt{font-size:12px;color:var(--mut)}
.ty{align-self:center;font-size:13px;padding:3px 8px;border-radius:6px;background:var(--bg);color:var(--mut);text-align:center}
.amt{font-size:21px;font-weight:700;text-align:right}
.p{color:var(--pl)}.m{color:var(--mi)}
.del{background:none;border:0;color:var(--mut);font-size:12px;padding:0}
body{background:radial-gradient(1000px 360px at 50% -120px,rgba(122,77,240,.14),transparent),var(--bg);padding:14px 14px 40px;-webkit-text-size-adjust:100%}
.card,#top{background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.card{padding:14px}
#top{padding:10px 12px}
input,select{height:46px;padding:0 12px;border:1.5px solid var(--bd);border-radius:10px;font-size:16px;outline:0;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(36,86,214,.15)}
.r2 .add{height:46px;padding:0 16px;border-radius:10px;box-shadow:0 2px 6px rgba(36,86,214,.25)}
.io button{height:46px;border-radius:10px}
.save{height:46px;padding:0 30px;border-radius:10px;box-shadow:0 2px 8px rgba(36,86,214,.3)}
#top .tabs{background:var(--bg);padding:3px;border-radius:12px;gap:2px}
#top .tabs button{border:0;background:transparent;color:var(--mut);border-radius:9px;padding:9px 16px}
#top .tabs button.on{background:var(--ac);color:#fff;box-shadow:0 2px 6px rgba(36,86,214,.3)}
.bc{min-height:84px;padding:16px 14px}
.bv{font-size:26px}
.row{padding:12px 0;align-items:center;gap:10px}
.row>div:first-child{flex:1;min-width:0}
.row>div:last-child{flex:none;text-align:right}
.nm{font-size:18px;word-break:break-word}
.ty{flex:none;font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid var(--bd)}
.amt{font-size:20px}
@media (max-width:420px){body{padding:10px 10px 40px}.card{padding:12px}.bc{min-height:76px;padding:13px 11px}.bv{font-size:21px}.bl{font-size:12px}.nm{font-size:16px}.amt{font-size:17px}.ty{font-size:11px;padding:3px 7px}#top{padding:8px 10px}#top .tabs button{padding:9px 12px;font-size:14px}.clk{font-size:11px}.clk b{font-size:16px}.r2 .add{padding:0 13px}.io button{padding:0 9px;font-size:13px}}
</style>
</head>
<body>

<div class="r2" id="top"><div id="clk" class="clk"></div><div class="tabs"><button id="t-dokan" onclick="setTab('dokan')">Dokan</button><button id="t-wp" onclick="setTab('wp')">WP</button></div></div>
<div class="bx" style="margin-top:12px"><div class="bc" id="c-tot" onclick="rev('tot')"><div class="bl" id="tlab">Total Balance</div><div class="bv" id="tot">••••••</div></div><div class="bc" id="c-bal" onclick="rev('bal')"><div class="bl" id="blab">Dokan Balance</div><div class="bv" id="bal">••••••</div></div></div>
<div class="r2" style="margin:8px 0 12px"><select id="flt" onchange="flt=this.value;render()"></select><input id="dflt" type="date" onchange="dflt=this.value;render()"><button class="add" onclick="clrD()">×</button></div>

<div class="card">
<div class="r2"><select id="name"></select><button class="add" onclick="toggleNN()">+</button></div>
<div class="r2" id="nn" style="display:none"><input id="newname" placeholder="Notun name"><button class="add" onclick="addName()">OK</button></div>
<input id="number" inputmode="tel" placeholder="Number">
<input id="dt" type="hidden">
<div class="r2"><input id="amount" inputmode="decimal" placeholder="Amount"><div class="io" id="io"><button class="in" id="b-in" onclick="setIO('in')">In (−)</button><button class="out" id="b-out" onclick="setIO('out')">Out (+)</button></div></div>
<select id="other" onchange="otherChg()">
<option value="">Other (lagle select korun)</option>
<option value="b2bin">B2B In (+)</option>
<option value="b2bout">B2B Out (−)</option>
<option value="last">Last Balance (+)</option>
<option value="comm">Commission (+)</option>
</select>
<div id="msg" class="mut" style="color:var(--mi);margin-top:8px"></div><div class="sv"><button class="save" id="sbtn" onclick="save()">Save</button></div>
</div>

<div class="card" id="list"></div>

<script>
var LBL={in:"In",out:"Out",b2bin:"B2B In",b2bout:"B2B Out",last:"Last Balance",comm:"Commission"};
var SIGN={in:-1,out:1,b2bin:1,b2bout:-1,last:1,comm:1};
var data={dokan:[],wp:[]},tab='dokan',flt='',io='';
try{var s=localStorage.getItem('hisab1');if(s)data=JSON.parse(s);}catch(e){}
if(!data.names)data.names=[];
function toggleNN(){var r=$('nn');r.style.display=r.style.display==='none'?'flex':'none';$('newname').focus()}
function addName(){var n=$('newname').value.trim();if(!n)return;if(data.names.indexOf(n)<0)data.names.push(n);persist();render();$('name').value=n;$('newname').value='';$('nn').style.display='none'}
function persist(){try{localStorage.setItem('hisab1',JSON.stringify(data));}catch(e){}}
function $(i){return document.getElementById(i)}
function fmt(n){return (Math.round(n*100)/100).toLocaleString('en-IN')}
var editId=null;var dflt='';
function toLocal(ts){var d=new Date(ts);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function dkey(ts){return toLocal(ts).slice(0,10)}
function setNow(){$('dt').value=toLocal(new Date())}
function tick(){var d=new Date();$('clk').innerHTML='<b>'+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+'</b>'+d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}tick();setInterval(tick,1000);
function clrD(){dflt='';$('dflt').value='';render()}
setNow();
var vals={tot:0,bal:0},shown={tot:false,bal:false};
function paint(k){var el=$(k);el.className='bv';el.textContent=shown[k]?fmt(vals[k]):'••••••'}
function rev(k){shown[k]=!shown[k];var el=$(k);if(!shown[k]){el.className='bv';el.textContent='••••••';return}
 el.className='bv';void el.offsetWidth;el.className='bv pop';var v=vals[k],t0=null;
 function st(ts){if(!t0)t0=ts;var p=Math.min((ts-t0)/700,1),e=1-Math.pow(1-p,3);el.textContent=fmt(p<1?v*e:v);if(p<1)requestAnimationFrame(st)}
 requestAnimationFrame(st)}
function cancelEdit(){editId=null;$('sbtn').textContent='Save'}
function edit(id){var e=data[tab].filter(function(x){return x.id===id})[0];if(!e)return;editId=id;
 $('name').value=e.name;$('number').value=e.num;$('amount').value=e.amt;
 if(e.type==='in'||e.type==='out'){$('other').value='';$('io').classList.remove('off');setIO(e.type)}else{$('other').value=e.type;otherChg()}
 $('dt').value=toLocal(e.ts);$('sbtn').textContent='Update';window.scrollTo(0,0)}
function setTab(t){tab=t;flt='';cancelEdit();render()}
function setIO(v){io=v;$('b-in').classList.toggle('on',v==='in');$('b-out').classList.toggle('on',v==='out')}
function otherChg(){var o=$('other').value;$('io').classList.toggle('off',!!o);if(o)setIO('')}
function alert(m){var x=$('msg');x.textContent=m;setTimeout(function(){x.textContent=''},2500)}
function save(){
 var name=$('name').value.trim(),num=$('number').value.trim(),amt=parseFloat($('amount').value);
 var type=$('other').value||io;
 if(!name){alert('Name din');return}
 if(isNaN(amt)){alert('Amount din');return}
 if(!type){alert('In/Out ba Other select korun');return}
 var ts=editId?new Date($('dt').value).toISOString():new Date().toISOString();
 if(editId){var ed=data[tab].filter(function(x){return x.id===editId})[0];if(ed){ed.name=name;ed.num=num;ed.amt=amt;ed.type=type;ed.ts=ts}cancelEdit()}else data[tab].unshift({id:Date.now(),name:name,num:num,amt:amt,type:type,ts:ts});
 persist();$('amount').value='';$('number').value='';$('other').value='';$('io').classList.remove('off');setIO('');setNow();render();
}
var delId=null;
function del(id){if(delId!==id){delId=id;render();return}delId=null;data[tab]=data[tab].filter(function(e){return e.id!==id});persist();render()}
function render(){
 $('t-dokan').className=tab==='dokan'?'on':'';$('t-wp').className=tab==='wp'?'on':'';
 var all=data[tab],names=[];
 data.dokan.concat(data.wp).forEach(function(e){if(names.indexOf(e.name)<0)names.push(e.name)});
 var all2=data.names.slice();names.forEach(function(n){if(all2.indexOf(n)<0)all2.push(n)});var cur=$('name').value;
 $('name').innerHTML='<option value="">Name select korun</option>'+all2.map(function(n){return '<option>'+esc(n)+'</option>'}).join('');$('name').value=cur;
 var fo='<option value="">All</option>';names.forEach(function(n){fo+='<option'+(flt===n?' selected':'')+'>'+esc(n)+'</option>'});$('flt').innerHTML=fo;
 var rows=all.filter(function(e){return (!flt||e.name===flt)&&(!dflt||dkey(e.ts)===dflt)}).sort(function(a,b){return new Date(b.ts)-new Date(a.ts)});
 var bal=0;rows.forEach(function(e){bal+=SIGN[e.type]*e.amt});
 vals.bal=bal;paint('bal');$('blab').textContent=(tab==='dokan'?'Dokan':'WP')+' Balance';
 var tb={dokan:0,wp:0};['dokan','wp'].forEach(function(k){data[k].forEach(function(e){if((!flt||e.name===flt)&&(!dflt||dkey(e.ts)===dflt))tb[k]+=SIGN[e.type]*e.amt})});var tt=tb.dokan+tb.wp;
 vals.tot=tt;paint('tot');$('tlab').textContent='Total Balance';
 $('list').innerHTML=rows.length?rows.map(function(e){
  var d=new Date(e.ts),pos=SIGN[e.type]>0;
  return '<div class="row"><div><div class="nm">'+esc(e.name)+'</div><div class="num">'+esc(e.num||'-')+'</div><button class="del" onclick="edit('+e.id+')">edit</button> &nbsp; <button class="del" onclick="del('+e.id+')">'+(delId===e.id?'<b style="color:var(--mi)">sure? tap again</b>':'delete')+'</button></div>'+
  '<div class="ty">'+LBL[e.type]+'</div>'+
  '<div><div class="amt '+(pos?'p':'m')+'">'+(pos?'+':'−')+fmt(e.amt)+'</div><div class="dt">'+d.toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})+'</div></div></div>';
 }).join(''):'<div class="mut">Kono entry nai</div>';
}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
render();
</script>
</body>
</html>
